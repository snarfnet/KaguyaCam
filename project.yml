name: KaguyaCam
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.KaguyaCam
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  KaguyaCam:
    type: application
    platform: iOS
    sources: [KaguyaCam]
    settings:
      base:
        INFOPLIST_FILE: KaguyaCam/Info.plist
        PRODUCT_NAME: KaguyaCam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KaguyaCam/Info.plist
      properties:
        CFBundleName: KaguyaCam
        CFBundleDisplayName: かぐや姫カメラ
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "夜空にカメラを向けて、今の月の方角と満ち欠けを重ねて表示するために使用します。映像の保存・送信は行いません。"
        NSLocationWhenInUseUsageDescription: "観測地点から見た月の方角と高度を正しく計算するために現在地を使用します。位置情報の保存・送信は行いません。"
        UIRequiredDeviceCapabilities:
          - armv7
          - arkit
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
